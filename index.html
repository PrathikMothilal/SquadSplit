    function formatINR(n) {
      if (!isFinite(n)) n = 0;
      const sign = n < -0.5 ? "-" : "";
      return sign + "₹" + Math.round(Math.abs(n)).toLocaleString("en-IN");
    }

    function formatDate(ts) {
      const date = new Date(ts);
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);

      if (date.toDateString() === today.toDateString()) return "Today";

      return date.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });

    function greedySettle(ids, amts) {
      const creditors = [];
      const debtors = [];
      ids.forEach((id, idx) => {
        const v = amts[idx];
        if (v > 0.5) creditors.push({ id, amt: v });
        else if (v < -0.5) debtors.push({ id, amt: -v });
      });
      creditors.sort((a, b) => b.amt - a.amt);
      debtors.sort((a, b) => b.amt - a.amt);
      const res = [];
      let ci = 0, di = 0;
      while (ci < creditors.length && di < debtors.length) {
        const c = creditors[ci], d = debtors[di];
        const amt = Math.min(c.amt, d.amt);
        res.push({ from: d.id, to: c.id, amount: Math.round(amt) });
        c.amt -= amt; d.amt -= amt;
        if (c.amt < 0.5) ci++;
        if (d.amt < 0.5) di++;
      }
      return res;
    }

    function optimalSettle(ids, amts) {
      let best = null;
      function dfs(bal, txns) {
        let i = 0;
        while (i < bal.length && Math.abs(bal[i]) < 0.5) i++;
        if (i === bal.length) {
          if (!best || txns.length < best.length) best = txns.slice();
          return;
        }
        if (best && txns.length >= best.length) return; 
        for (let j = 0; j < bal.length; j++) {
          if (j === i || Math.abs(bal[j]) < 0.5) continue;
          if ((bal[i] > 0) === (bal[j] > 0)) continue; 
          const amt = Math.min(Math.abs(bal[i]), Math.abs(bal[j]));
          const next = bal.slice();
          next[i] += bal[i] > 0 ? -amt : amt;
          next[j] += bal[j] > 0 ? -amt : amt;
          const from = bal[i] < 0 ? ids[i] : ids[j];
          const to = bal[i] < 0 ? ids[j] : ids[i];
          txns.push({ from, to, amount: amt });
          dfs(next, txns);
          txns.pop();
        }
      }
      dfs(amts.slice(), []);
      return (best || []).map((t) => ({ from: t.from, to: t.to, amount: Math.round(t.amount) })).filter((t) => t.amount > 0);
    }

    function regularSettle(expensesList, settlementsList) {
      const net = {}; 
      function addOwed(ower, payee, amt) {
        if (ower === payee || !amt) return;
        let a = ower, b = payee, sign = 1;
        if (a > b) { [a, b] = [b, a]; sign = -1; }
        const key = a + "|" + b;
        net[key] = (net[key] || 0) + sign * amt;
      }
      expensesList.forEach((e) => {
        e.participants.forEach((p) => {
          if (p === e.paidBy) return;
          const share = e.splitType === "equal" ? e.amount / e.participants.length : (e.customSplits[p] || 0);
          addOwed(p, e.paidBy, share);
        });
      });
      settlementsList.forEach((s) => {
        addOwed(s.from, s.to, -s.amount);
      });
      const res = [];
      Object.keys(net).forEach((key) => {
        const val = net[key];
        if (Math.abs(val) < 0.5) return;
        const [a, b] = key.split("|");
        if (val > 0) res.push({ from: a, to: b, amount: Math.round(val) });
        else res.push({ from: b, to: a, amount: Math.round(-val) });
      });
      return res;
    }

      useEffect(() => {
        const initDB = async () => {
          while (!window.Firebase) {

          }
          
          const fb = window.Firebase;
          const appId = window.FIREBASE_APP_ID || 'squadsplit-default';

          if (!config.apiKey) {
              setGroups(seedGroups);
              setActiveGroupId(seedGroups[0].id);
              setIsDBReady(true);
              return;
          }

          try {
              const app = fb.initializeApp(config);
              const auth = fb.getAuth(app);
              const db = fb.initializeFirestore(app, {
                localCache: fb.persistentLocalCache({
                  tabManager: fb.persistentSingleTabManager()
                })
              });
              
              const cred = await fb.signInAnonymously(auth);
              const user = cred.user;
              
              window.db = db;
              window.uid = user.uid;
              window.aid = appId;
              window.isFirebaseActive = true;
              
              const groupsRef = fb.collection(db, 'artifacts', appId, 'users', user.uid, 'groups');
              fb.onSnapshot(groupsRef, (snapshot) => {
                 const fetched = [];
                 snapshot.forEach(doc => fetched.push(doc.data()));
                 fetched.sort((a, b) => b.createdAt - a.createdAt);
                 
                 if (fetched.length === 0) {
                     seedGroups.forEach(g => {
                        fb.setDoc(fb.doc(db, 'artifacts', appId, 'users', user.uid, 'groups', g.id), g);
                     });
                 } else {
                     setGroups(fetched);
                     setActiveGroupId(curr => {
                         if (!curr || !fetched.some(g => g.id === curr)) return fetched[0].id;
                         return curr;
                     });
                     setIsDBReady(true);
                 }
              });

              // Load user categories
              const catRef = fb.doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'categories');
              fb.onSnapshot(catRef, (docSnap) => {
                  if (docSnap.exists()) {
                      setCategories(docSnap.data());
                  }
              });
              
          } catch(err) {
              console.error("Firebase initialization failed:", err);
              setGroups(seedGroups);
              setActiveGroupId(seedGroups[0].id);
              setIsDBReady(true);
          }
        };
        
        initDB();
      }, []);

      async function updateGroupInDB(groupId, updaterFn) {
        if (!isDBReady) return;
        setGroups(prev => {
          const targetGroup = prev.find(g => g.id === groupId);
          if (!targetGroup) return prev;
          
          const updatedFields = updaterFn(targetGroup);
          const newGroupData = { ...targetGroup, ...updatedFields };
          
          if (window.isFirebaseActive) {
             window.Firebase.setDoc(
                window.Firebase.doc(window.db, 'artifacts', window.aid, 'users', window.uid, 'groups', groupId),
                newGroupData
             ).catch(console.error);
          }
          return prev.map(g => g.id === groupId ? newGroupData : g);
        });
      }

      function updateCategoriesInDB(newCats) {
        setCategories(newCats);
        if (window.isFirebaseActive) {
            window.Firebase.setDoc(
                window.Firebase.doc(window.db, 'artifacts', window.aid, 'users', window.uid, 'settings', 'categories'),
                newCats
            ).catch(console.error);
        }
      }

      // Safe access defaults
      const activeGroup = groups.find((g) => g.id === activeGroupId) || groups[0] || { id: "temp", name: "Loading...", members: [], expenses: [], settlements: [] };
      const members = activeGroup.members;
      const expenses = activeGroup.expenses;
      const settlements = activeGroup.settlements;

      // UI View State
      const [activeTab, setActiveTab] = useState("dashboard"); // dashboard, ledger, groups, settle, settings
      const [expandedSettleMember, setExpandedSettleMember] = useState(null);
      const [isSettleModeOpen, setIsSettleModeOpen] = useState(false);
      const [analyticsFilter, setAnalyticsFilter] = useState("all"); 
      
      // Form/Modal States
      const [isAddExpenseOpen, setIsAddExpenseOpen] = useState(false);
      const [editingExpenseId, setEditingExpenseId] = useState(null); 
      
      // Settings Modal States
      const [isCategoryModalOpen, setIsCategoryModalOpen] = useState(false);
      const [editingCategory, setEditingCategory] = useState(null);
      const [catForm, setCatForm] = useState({ label: '', icon: 'MoreHorizontal', colorId: 'zinc' });

      // Expense Form State
      const [desc, setDesc] = useState("");
      const [amount, setAmount] = useState("");
      const [category, setCategory] = useState("other");
      const [paidBy, setPaidBy] = useState("m1");
      const [participants, setParticipants] = useState([]);
      const [splitType, setSplitType] = useState("equal");
      const [customSplits, setCustomSplits] = useState({});
      const [formError, setFormError] = useState("");
      const [isScanning, setIsScanning] = useState(false);
      
      const [dialog, setDialog] = useState({ isOpen: false, title: "", message: "", onConfirm: null, confirmText: "Confirm", isDestructive: true });

      const effectivePaidBy = members.find((m) => m.id === paidBy) ? paidBy : (members[0]?.id || "");
      const memberOf = (id) => members.find((m) => m.id === id) || { name: "Unknown", color: "bg-zinc-600" };

      const balances = useMemo(() => {
        const bal = {};
        members.forEach((m) => (bal[m.id] = 0));
        
        expenses.forEach((e) => {
          bal[e.paidBy] = (bal[e.paidBy] || 0) + e.amount;
          e.participants.forEach((p) => {
            let share = 0;
            if (e.splitType === "equal") {
              share = e.amount / e.participants.length;
            } else {
              share = e.customSplits[p] || 0;
            }
            bal[p] = (bal[p] || 0) - share;
          });
        });

        settlements.forEach((s) => {
          bal[s.from] = (bal[s.from] || 0) + s.amount;
          bal[s.to] = (bal[s.to] || 0) - s.amount;
        });
        return bal;
      }, [members, expenses, settlements]);

      const settleMode = activeGroup.settleMode || "smart";
      const settleLocked = settlements.length > 0;

      function changeSettleMode(mode) {
        if (settleLocked || mode === settleMode) return;
        updateGroupInDB(activeGroupId, () => ({ settleMode: mode }));
      }

      const suggestions = useMemo(() => {
        if (settleMode === "regular") {
          return regularSettle(expenses, settlements);
        }
        const ids = [];
        const amts = [];
        Object.entries(balances).forEach(([id, v]) => {
          if (Math.abs(v) > 0.5) { ids.push(id); amts.push(v); }
        });
        if (ids.length === 0) return [];
        return ids.length > 12 ? greedySettle(ids, amts) : optimalSettle(ids, amts);
      }, [balances, settleMode, expenses, settlements]);

      const totalSpent = expenses.reduce((s, e) => s + e.amount, 0);

      // Analytics Logic
      const filteredExpenses = useMemo(() => {
        if (analyticsFilter === "all") return expenses.map(e => ({...e, share: e.amount}));
        return expenses.map(e => {
          let share = 0;
          if (e.participants.includes(analyticsFilter)) {
             if (e.splitType === "equal") share = e.amount / e.participants.length;
             else share = e.customSplits[analyticsFilter] || 0;
          }
          return { ...e, share };
        }).filter(e => e.share > 0);
      }, [expenses, analyticsFilter]);

      const filteredTotalSpent = useMemo(() => filteredExpenses.reduce((sum, e) => sum + e.share, 0), [filteredExpenses]);

      const filteredCategoryBreakdown = useMemo(() => {
        const breakdown = {};
        Object.keys(categories).forEach(k => breakdown[k] = 0);
        filteredExpenses.forEach(e => {
          const catId = categories[e.category] ? e.category : "other";
          breakdown[catId] = (breakdown[catId] || 0) + e.share;
        });
        return Object.entries(breakdown)
          .map(([catId, amt]) => {
             const c = categories[catId] || categories["other"];
             return { ...c, amount: amt, percent: filteredTotalSpent ? (amt / filteredTotalSpent) * 100 : 0 };
          })
          .filter(c => c.amount > 0)
          .sort((a, b) => b.amount - a.amount);
      }, [filteredExpenses, filteredTotalSpent, categories]);
      
      const pieConicStops = useMemo(() => {
        let currentAngle = 0;
        return filteredCategoryBreakdown.map(cat => {
          const start = currentAngle;
          currentAngle += cat.percent;
          return `${cat.hex} ${start}% ${currentAngle}%`;
        }).join(", ");
      }, [filteredCategoryBreakdown]);

      const activity = useMemo(() => {
        const a = expenses.map((e) => ({ ...e, type: "expense" }));
        const s = settlements.map((s) => ({ ...s, type: "settlement" }));
        return [...a, ...s].sort((x, y) => y.date - x.date);
      }, [expenses, settlements]);

      const groupedActivity = useMemo(() => {
        const map = new Map();
        activity.forEach((item) => {
          const key = new Date(item.date).toDateString();
          if (!map.has(key)) map.set(key, { date: item.date, items: [] });
          map.get(key).items.push(item);
        });
        return Array.from(map.values());
      }, [activity]);

      useEffect(() => {
        setParticipants(activeGroup.members.map((m) => m.id));
        setPaidBy(activeGroup.members[0]?.id || "");
        setExpandedSettleMember(null);
        setEditingExpenseId(null);
      }, [activeGroupId, activeGroup.id]);

      async function createGroup(e) {
        e.preventDefault();

        if (!name) return;
        const id = "g" + Date.now();
        const newGroup = { id, name, members: [], expenses: [], settlements: [], createdAt: Date.now() };
        
        setGroups((prev) => [newGroup, ...prev]);
        setActiveGroupId(id);
        setNewGroupName("");
        setExpandedGroupId(id);
        
        if (window.isFirebaseActive) {
           window.Firebase.setDoc(
              window.Firebase.doc(window.db, 'artifacts', window.aid, 'users', window.uid, 'groups', id),
              newGroup
           ).catch(console.error);
        }
      }

      function requestDeleteGroup(id) {
        const target = groups.find((g) => g.id === id);
        if (!target) return;
        setDialog({
          isOpen: true,
          title: "Delete Trip?",
          message: target.expenses.length > 0

            : `Are you sure you want to delete "${target.name}"?`,

          isDestructive: true,
          onConfirm: async () => {
            const remaining = groups.filter((g) => g.id !== id);
            if (remaining.length === 0) {

              const newGroup = { id: newId, name: "New Trip", members: [], expenses: [], settlements: [], createdAt: Date.now() };
              setGroups([newGroup]);
              setActiveGroupId(newId);
              setExpandedGroupId(newId);
              if (window.isFirebaseActive) {
                 window.Firebase.setDoc(
                    window.Firebase.doc(window.db, 'artifacts', window.aid, 'users', window.uid, 'groups', newId),
                    newGroup
                 ).catch(console.error);
              }
            } else {
              setGroups(remaining);
              if (activeGroupId === id) setActiveGroupId(remaining[0].id);
              if (expandedGroupId === id) setExpandedGroupId(null);
            }
            setDialog({ isOpen: false });
            if (window.isFirebaseActive) {
               window.Firebase.deleteDoc(
                  window.Firebase.doc(window.db, 'artifacts', window.aid, 'users', window.uid, 'groups', id)
               ).catch(console.error);
            }
          }
        });
      }

      function addMemberToGroup(groupId, name) {
        const trimmed = (name || "").trim();
        if (!trimmed) return;
        const id = "m" + Date.now();
        updateGroupInDB(groupId, (g) => ({
           members: [...g.members, { id, name: trimmed, color: AVATAR_COLORS[g.members.length % AVATAR_COLORS.length] }]
        }));
        if (groupId === activeGroupId) setParticipants((p) => [...p, id]);
        setMemberInputByGroup((prev) => ({ ...prev, [groupId]: "" }));
      }

      function requestRemoveMember(groupId, memberId) {
        const group = groups.find((g) => g.id === groupId);
        if (!group) return;
        const member = group.members.find((m) => m.id === memberId);
        const used = group.expenses.some((e) => e.paidBy === memberId || e.participants.includes(memberId)) || group.settlements.some((s) => s.from === memberId || s.to === memberId);
        
        if (used) {
          setDialog({
            isOpen: true,
            title: "Cannot Remove Member",
            message: `${member?.name} is part of existing expenses or settlements. You cannot remove them unless you delete those expenses first.`,
            confirmText: "Okay",
            isDestructive: false,
            onConfirm: () => setDialog({ isOpen: false })
          });
          return;
        }

        setDialog({
          isOpen: true,
          title: "Remove Member?",
          message: `Are you sure you want to remove ${member?.name} from this trip?`,
          confirmText: "Remove",
          isDestructive: true,
          onConfirm: () => {
            updateGroupInDB(groupId, (g) => ({
               members: g.members.filter((m) => m.id !== memberId)
            }));
            if (groupId === activeGroupId) setParticipants((p) => p.filter((pid) => pid !== memberId));
            setDialog({ isOpen: false });
          }
        });
      }

      function toggleParticipant(id) {
        setParticipants((prev) => {
          const isSelected = prev.includes(id);
          if (isSelected && prev.length === 1) return prev; 
          return isSelected ? prev.filter((p) => p !== id) : [...prev, id];
        });
      }

      function handleCustomSplitChange(pid, val) {
        const newVal = parseFloat(val) || 0;
        setCustomSplits(prev => ({ ...prev, [pid]: newVal }));
      }

      function openExpenseFormForNew() {
        setEditingExpenseId(null);
        setDesc(""); 
        setAmount(""); 
        setCustomSplits({}); 
        setSplitType("equal");
        setCategory("other");
        setParticipants(activeGroup.members.map((m) => m.id));
        setPaidBy(activeGroup.members[0]?.id || "");
        setIsAddExpenseOpen(true);
      }

      function openExpenseFormForEdit(expense) {
        setEditingExpenseId(expense.id);
        setDesc(expense.description);
        setAmount(expense.amount.toString());
        setCategory(categories[expense.category] ? expense.category : "other");
        setPaidBy(expense.paidBy);
        setParticipants(expense.participants);
        setSplitType(expense.splitType); 
        setCustomSplits(expense.customSplits || {});
        setIsAddExpenseOpen(true);
      }

      async function handleReceiptUpload(e) {
        const file = e.target.files?.[0];
        if (!file) return;

        setFormError("");
        setIsScanning(true);

        try {
          const base64Data = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => {
                const result = reader.result;
                if (typeof result === 'string') resolve(result.split(',')[1]);
                else reject(new Error("Failed to read file"));
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });

          // Fetch API setup using environment/injected key (safe for GitHub)
          const apiKey = ""; 
          const validCategoriesList = Object.values(categories).map(c => c.label).join(", ");
          const prompt = `Analyze this receipt. Return a JSON object with 'amount' (number, total amount paid), 'description' (string, usually the merchant or store name), and 'category' (string, MUST be exactly one of these: ${validCategoriesList}). Be as accurate as possible. Only return the JSON.`;
          
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

          let resultData = null;
          let delay = 1000;

          // Retry loop with exponential backoff for rate limits
          for (let i = 0; i < 3; i++) {
            try {
              const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{
                    role: "user",
                    parts: [
                      { text: prompt },
                      { inlineData: { mimeType: file.type || 'image/jpeg', data: base64Data } }
                    ]
                  }],
                  generationConfig: { responseMimeType: "application/json" }
                })
              });
              
              if (!res.ok) {
                 if (res.status === 429) throw new Error("Rate limit");
                 throw new Error(`API Error: ${res.status}`);
              }
              
              resultData = await res.json();
              break;
            } catch (err) {
              if (i === 2) throw err;
              await new Promise(r => setTimeout(r, delay));
              delay *= 2;
            }
          }

          let jsonText = resultData?.candidates?.[0]?.content?.parts?.[0]?.text;

          if (jsonText) {
            jsonText = jsonText.replace(/```json/gi, '').replace(/```/g, '').trim();
            const parsed = JSON.parse(jsonText);

            if (parsed.amount) setAmount(parsed.amount.toString());
            if (parsed.description) setDesc(parsed.description);

            if (parsed.category) {
                const matchedCategory = Object.values(categories).find(c => c.label.toLowerCase() === parsed.category.toLowerCase());
                setCategory(matchedCategory ? matchedCategory.id : "other");
            } else {
                setCategory("other");
            }
          } else {
            throw new Error("Could not extract data from the receipt.");
          }
        } catch (err) {
          console.error("Scanning error:", err);
          setFormError("Receipt scan failed. Please try again or enter details manually.");
        } finally {
          setIsScanning(false);
          if (e.target) e.target.value = '';
        }
      }

      function handleSaveExpense(e) {
        e.preventDefault();
        setFormError("");
        const amt = parseFloat(amount);
        
        if (!amt || amt <= 0) return setFormError("Please enter a valid amount.");
        if (participants.length === 0) return setFormError("Select at least one person.");

        const finalDesc = desc.trim() || categories[category]?.label || "Expense";
        let finalCustomSplits = { ...customSplits };

        if (splitType === "exact") {
          const sum = participants.reduce((s, p) => s + (finalCustomSplits[p] || 0), 0);
          if (Math.abs(sum - amt) > 0.5) return setFormError(`Exact splits must add up to ${formatINR(amt)}. Current sum: ${formatINR(sum)}.`);
        } else if (splitType === "percentage") {
          const percentSum = participants.reduce((s, p) => s + (finalCustomSplits[p] || 0), 0);
          if (Math.abs(percentSum - 100) > 0.5) return setFormError(`Percentages must add up to 100%. Current sum: ${percentSum}%.`);
          participants.forEach(p => { finalCustomSplits[p] = (finalCustomSplits[p] / 100) * amt; });
        }

        let expenseDate = Date.now();
        if (editingExpenseId) {
          const existing = expenses.find(exp => exp.id === editingExpenseId);
          if (existing) expenseDate = existing.date;
        }

        const newExpense = {
          id: editingExpenseId || ("e" + Date.now()),
          description: finalDesc,
          amount: amt,
          category,
          paidBy: effectivePaidBy,
          participants: [...participants],
          splitType: splitType === "percentage" ? "exact" : splitType, 
          customSplits: finalCustomSplits,
          date: expenseDate,
        };

        updateGroupInDB(activeGroupId, (g) => {
            if (editingExpenseId) return { expenses: g.expenses.map(exp => exp.id === editingExpenseId ? newExpense : exp) };
            return { expenses: [newExpense, ...g.expenses] };
        });
        
        setIsAddExpenseOpen(false);
      }

      function openCategoryModal(cat = null) {
        setFormError("");
        if (cat) {
           const colorObj = CATEGORY_COLORS.find(c => c.hex === cat.hex) || CATEGORY_COLORS[0];
           setEditingCategory(cat.id);
           setCatForm({ label: cat.label, icon: cat.icon, colorId: colorObj.id });
        } else {
           setEditingCategory(null);
           setCatForm({ label: '', icon: AVAILABLE_ICONS[0], colorId: CATEGORY_COLORS[0].id });
        }
        setIsCategoryModalOpen(true);
      }

      function saveCategoryDetails() {
         const label = catForm.label.trim();
         if (!label) return setFormError("Category name cannot be empty.");
         
         const colorObj = CATEGORY_COLORS.find(c => c.id === catForm.colorId);

         newCats[idToSave] = {

         };
         
         updateCategoriesInDB(newCats);

      }

      function deleteCategory() {
         if (!editingCategory || editingCategory === "other") return;
         setDialog({
            isOpen: true,
            title: "Delete Category?",
            message: `Any existing expenses using "${categories[editingCategory]?.label}" will be moved to "Other".`,
            confirmText: "Delete",
            isDestructive: true,
            onConfirm: () => {
               const newCats = { ...categories };
               delete newCats[editingCategory];
               updateCategoriesInDB(newCats);
               setDialog({ isOpen: false });
               setIsCategoryModalOpen(false);
            }
         });
      }

      if (!isDBReady) {
        return (
          <div className="min-h-screen bg-[#050505] flex items-center justify-center p-0 sm:p-4">
            <div className="w-full h-[100dvh] sm:h-[850px] sm:max-h-[90vh] sm:max-w-[420px] bg-[#0A0A0B] sm:rounded-[2.5rem] sm:border-[6px] border-zinc-800 shadow-2xl flex flex-col items-center justify-center gap-4 relative overflow-hidden">
                <div className="absolute inset-0 bg-gradient-to-br from-indigo-900/10 to-purple-900/10 z-0"></div>
                <Icons.Loader2 size={38} className="text-indigo-500 animate-spin z-10" />
                <p className="text-zinc-400 font-medium text-sm tracking-wide z-10">Syncing Data...</p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#050505] flex items-center justify-center p-0 sm:p-4">
          <div className="w-full h-[100dvh] sm:h-[850px] sm:max-h-[90vh] sm:max-w-[420px] bg-[#0A0A0B] sm:rounded-[2.5rem] sm:border-[6px] border-zinc-800 shadow-2xl relative overflow-hidden flex flex-col">
            
            <div className="hidden sm:block absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-zinc-800 rounded-b-2xl z-50"></div>

            <header className="px-5 pt-12 sm:pt-8 pb-4 bg-gradient-to-b from-indigo-950/20 to-transparent sticky top-0 z-30 backdrop-blur-md border-b border-white/5">
              <div className="flex items-center justify-between mb-4">
                <button onClick={() => setActiveTab("groups")} className="flex items-center gap-2.5 text-left active:opacity-70 transition-opacity">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <Icons.Wallet size={20} className="text-white" />
                  </div>
                  <div>
                    <h1 className="font-bold text-lg leading-tight tracking-tight text-zinc-100">SquadSplit</h1>

                </button>
                <div className="flex items-center gap-4">
                  <button onClick={() => setActiveTab("settings")} className={`w-8 h-8 rounded-full flex items-center justify-center transition-colors ${activeTab === "settings" ? "bg-indigo-500/20 text-indigo-400" : "bg-zinc-800/50 text-zinc-400 hover:text-white hover:bg-zinc-700"}`}>
                    <Icons.Settings size={16} />

                    {members.slice(0, 3).map(m => (

              {activeTab === "dashboard" && (

              </div>

              <button onClick={() => setActiveTab("groups")} className={`flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-2xl transition-all ${activeTab === "groups" ? "text-indigo-400" : "text-zinc-500 hover:text-zinc-300"}`}>
                <Icons.Folder size={22} className={activeTab === "groups" ? "text-indigo-400" : ""} />
                <span className="text-[10px] font-medium">Trips</span>
              </button>

              <button onClick={() => setActiveTab("settle")} className={`flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-2xl transition-all relative ${activeTab === "settle" ? "text-indigo-400" : "text-zinc-500 hover:text-zinc-300"}`}>
                <Icons.ArrowLeftRight size={22} className={activeTab === "settle" ? "text-indigo-400" : ""} />
                <span className="text-[10px] font-medium">Settle</span>
                {suggestions.length > 0 && (
                  <span className="absolute top-1 right-[25%] w-4 h-4 bg-rose-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center border-2 border-zinc-900">
                    {suggestions.length}
                  </span>
                )}
              </button>
            </div>

            {/* EXPENSE MODAL */}
            {isAddExpenseOpen && (
              <div className="absolute inset-0 bg-[#0A0A0B] z-50 flex flex-col transition-all duration-300">
                <div className="flex items-center justify-between px-5 pt-12 sm:pt-8 pb-4 bg-zinc-950 border-b border-white/5">
                  <button onClick={() => setIsAddExpenseOpen(false)} className="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-zinc-400 hover:bg-zinc-900 transition-colors">
                    <Icons.ChevronLeft size={24} />
                  </button>
                  <h2 className="text-lg font-bold text-white">
                    {editingExpenseId ? "Edit Expense" : "New Expense"}
                  </h2>
                  <div className="w-10"></div> 
                </div>

                <div className="flex-1 overflow-y-auto p-5 custom-scrollbar pb-24">
                  <form onSubmit={handleSaveExpense} className="space-y-6">
                    <div className="bg-zinc-900/50 p-5 rounded-3xl border border-white/5 flex flex-col items-center text-center">
                      <div className="flex items-center justify-center text-5xl font-bold text-white mb-6 transition-all">
                        <span className={`mr-1 text-4xl ${isScanning ? 'text-zinc-700' : 'text-zinc-500'}`}>₹</span>
                        <input type="number" autoFocus min="0" step="0.01" inputMode="decimal" placeholder="0.00" value={amount} onChange={(e) => setAmount(e.target.value)} disabled={isScanning} className={`bg-transparent w-[200px] text-center outline-none transition-colors ${isScanning ? 'text-zinc-500 placeholder:text-zinc-800' : 'text-white placeholder:text-zinc-700'}`} />
                      </div>

                      <div className="relative w-full max-w-[280px] mx-auto flex items-center justify-center">
                        <input type="text" placeholder={isScanning ? "Scanning receipt..." : "What was this for?"} value={desc} onChange={(e) => setDesc(e.target.value)} disabled={isScanning} className={`w-full bg-transparent text-center text-xl font-semibold outline-none px-12 transition-colors ${isScanning ? 'text-indigo-400 placeholder:text-indigo-500/50 animate-pulse' : 'text-white placeholder:text-zinc-600'}`} />
                        
                        <label className="absolute right-0 top-1/2 -translate-y-1/2 cursor-pointer flex items-center justify-center w-10 h-10 rounded-full bg-zinc-800/50 hover:bg-zinc-700/80 text-zinc-400 hover:text-indigo-400 transition-all border border-white/5 shadow-sm group overflow-hidden">
                          <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleReceiptUpload} disabled={isScanning} />
                          {isScanning ? (
                            <Icons.Loader2 size={18} className="animate-spin text-indigo-400" />
                          ) : (
                            <Icons.Camera size={18} className="group-active:scale-90 transition-transform" />
                          )}
                        </label>
                      </div>
                    </div>

                    <div>
                      <label className="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-3 block">Category</label>
                      <div className="flex gap-3 overflow-x-auto pb-2 -mx-5 px-5 custom-scrollbar hide-scroll-bar">
                        {Object.values(categories).map((cat) => {
                          const CatIcon = Icons[cat.icon] || Icons.MoreHorizontal;
                          return (
                            <button key={cat.id} type="button" onClick={() => setCategory(cat.id)} className={`flex flex-col items-center gap-2 flex-shrink-0 w-[72px] p-3 rounded-2xl border transition-all ${category === cat.id ? `bg-zinc-800 border-${cat.color.split('-')[1]}-500 shadow-sm` : 'bg-zinc-900/50 border-transparent opacity-60 hover:opacity-100'}`}>
                              <div className={`w-10 h-10 rounded-full flex items-center justify-center ${category === cat.id ? cat.bg + ' ' + cat.color : 'bg-zinc-800 text-zinc-400'}`}>
                                <CatIcon size={18} />
                              </div>
                              <span className={`text-[10px] font-medium text-center leading-tight ${category === cat.id ? 'text-zinc-200' : 'text-zinc-500'}`}>{cat.label}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <div>
                      <label className="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-3 block">Paid By</label>
                      <div className="flex flex-wrap gap-2">
                        {members.map((m) => (
                          <button key={m.id} type="button" onClick={() => setPaidBy(m.id)} className={`flex items-center gap-2 py-2 px-4 rounded-xl border text-sm font-medium transition-all ${effectivePaidBy === m.id ? 'bg-indigo-500/10 border-indigo-500 text-indigo-300' : 'bg-zinc-900/50 border-zinc-800 text-zinc-400 hover:bg-zinc-800'}`}>
                            <div className={`w-5 h-5 rounded-full text-[8px] flex items-center justify-center text-white ${m.color}`}>{initials(m.name)}</div>
                            {m.name}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-3 flex justify-between">
                        <span>Split Between</span>
                        <span className="text-zinc-400 normal-case font-normal">{participants.length} selected</span>
                      </label>
                      <div className="flex flex-wrap gap-2 mb-4">
                        {members.map((m) => {
                          const isSelected = participants.includes(m.id);
                          return (
                            <button key={m.id} type="button" onClick={() => toggleParticipant(m.id)} className={`flex items-center gap-2 py-2 px-3 rounded-xl border text-sm font-medium transition-all ${isSelected ? 'bg-zinc-800 border-zinc-600 text-zinc-200' : 'bg-zinc-950 border-zinc-800/50 text-zinc-600'}`}>
                              <div className={`w-4 h-4 rounded-full border flex items-center justify-center ${isSelected ? 'border-indigo-500 bg-indigo-500 text-white' : 'border-zinc-700'}`}>
                                {isSelected && <Icons.Check size={10} />}
                              </div>
                              {m.name}
                            </button>
                          );
                        })}
                      </div>

                      <div className="bg-zinc-900 p-1.5 rounded-xl flex gap-1 mb-4">
                        {['equal', 'exact', 'percentage'].map(type => (
                          <button key={type} type="button" onClick={() => setSplitType(type)} className={`flex-1 py-2 text-xs font-semibold rounded-lg capitalize transition-all ${splitType === type ? 'bg-zinc-700 text-white shadow-sm' : 'text-zinc-500 hover:text-zinc-300'}`}>
                            {type}
                          </button>
                        ))}
                      </div>

                      {splitType !== "equal" && (
                        <div className="bg-zinc-900/50 rounded-2xl p-4 border border-white/5 space-y-3">
                          {participants.map((pid) => (
                            <div className="flex items-center justify-between gap-4" key={pid}>
                              <span className="text-sm font-medium text-zinc-300">{memberOf(pid).name}</span>
                              <div className="relative">
                                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 text-sm">{splitType === 'exact' ? '₹' : '%'}</span>
                                <input type="number" inputMode="decimal" min="0" step="0.01" value={customSplits[pid] || ""} onChange={(e) => handleCustomSplitChange(pid, e.target.value)} placeholder="0" className="w-28 bg-zinc-950 border border-zinc-800 text-white rounded-lg pl-7 pr-3 py-2 text-right text-sm outline-none focus:border-indigo-500" />
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {formError && (
                      <div className="bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm p-3 rounded-xl flex items-start gap-2">
                        <span className="mt-0.5">⚠️</span> {formError}
                      </div>
                    )}
                  </form>
                </div>

                <div className="p-5 bg-zinc-950 border-t border-white/5">
                  <button onClick={handleSaveExpense} className="w-full py-4 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-lg shadow-[0_4px_14px_rgba(99,102,241,0.3)] hover:shadow-[0_6px_20px_rgba(99,102,241,0.4)] transition-all active:scale-[0.98]">
                    {editingExpenseId ? "Update Expense" : "Save Expense"}
                  </button>
                </div>
              </div>
            )}
            
            {/* CATEGORY SETTINGS MODAL */}
            {isCategoryModalOpen && (
              <div className="absolute inset-0 bg-[#0A0A0B] z-50 flex flex-col transition-all duration-300">
                 <div className="flex items-center justify-between px-5 pt-12 sm:pt-8 pb-4 bg-zinc-950 border-b border-white/5">
                  <button onClick={() => setIsCategoryModalOpen(false)} className="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-zinc-400 hover:bg-zinc-900 transition-colors">
                    <Icons.ChevronLeft size={24} />
                  </button>
                  <h2 className="text-lg font-bold text-white">
                    {editingCategory ? "Edit Category" : "New Category"}
                  </h2>
                  <div className="w-10"></div> 
                </div>

                <div className="flex-1 overflow-y-auto p-5 custom-scrollbar pb-24 space-y-8">
                   
                   <div className="flex justify-center">
                     <div className={`w-24 h-24 rounded-full flex items-center justify-center ${CATEGORY_COLORS.find(c=>c.id===catForm.colorId)?.bg} ${CATEGORY_COLORS.find(c=>c.id===catForm.colorId)?.color}`}>
                        {(() => {
                           const IconComp = Icons[catForm.icon] || Icons.MoreHorizontal;
                           return <IconComp size={42} />;
                        })()}
                     </div>
                   </div>

                   <div>
                      <label className="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2 block">Name</label>
                      <input type="text" value={catForm.label} onChange={e => setCatForm({...catForm, label: e.target.value})} placeholder="e.g. Sushi" className="w-full bg-zinc-900/80 border border-zinc-800 text-white font-semibold rounded-xl px-4 py-3 outline-none focus:border-indigo-500" />
                   </div>

                   <div>
                      <label className="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-3 block">Color</label>
                      <div className="flex flex-wrap gap-3">
                         {CATEGORY_COLORS.map(color => (
                            <button key={color.id} onClick={() => setCatForm({...catForm, colorId: color.id})} className={`w-10 h-10 rounded-full flex items-center justify-center transition-all ${catForm.colorId === color.id ? 'ring-2 ring-offset-2 ring-offset-[#0A0A0B] ring-indigo-500' : 'hover:scale-110'}`} style={{ backgroundColor: color.hex }}>
                               {catForm.colorId === color.id && <Icons.Check size={18} className="text-black/60" />}
                            </button>
                         ))}
                      </div>
                   </div>

                   <div>
                      <label className="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-3 block">Icon</label>
                      <div className="grid grid-cols-5 gap-3">
                         {AVAILABLE_ICONS.map(iconName => {
                            const IconComp = Icons[iconName];
                            const isSelected = catForm.icon === iconName;
                            return (
                               <button key={iconName} onClick={() => setCatForm({...catForm, icon: iconName})} className={`aspect-square rounded-xl flex items-center justify-center transition-all ${isSelected ? 'bg-indigo-500 text-white' : 'bg-zinc-900 text-zinc-400 hover:text-white hover:bg-zinc-800'}`}>
                                  <IconComp size={20} />
                               </button>
                            );
                         })}
                      </div>
                   </div>

                   {formError && (
                      <div className="bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm p-3 rounded-xl flex items-start gap-2">
                        <span className="mt-0.5">⚠️</span> {formError}
                      </div>
                   )}
                </div>

                <div className="p-5 bg-zinc-950 border-t border-white/5 space-y-3">
                  <button onClick={saveCategoryDetails} className="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold shadow-lg hover:shadow-xl transition-all">
                    Save Category
                  </button>
                  {editingCategory && editingCategory !== "other" && (
                    <button onClick={deleteCategory} className="w-full py-3.5 rounded-xl bg-transparent text-rose-400 font-bold hover:bg-rose-500/10 transition-colors">
                      Delete Category
                    </button>
                  )}
                </div>
              </div>
            )}

            {/* GLOBAL DIALOG */}
            {dialog.isOpen && (
              <div className="absolute inset-0 z-[100] flex items-center justify-center p-4">
                <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setDialog({ isOpen: false })}></div>
                <div className="bg-[#171719] border border-zinc-800 rounded-3xl p-6 w-full max-w-[320px] relative z-10 shadow-2xl animate-in fade-in zoom-in-95 duration-200">
                  <h3 className="text-xl font-bold text-white mb-2">{dialog.title}</h3>
                  <p className="text-zinc-400 text-sm mb-6 leading-relaxed">{dialog.message}</p>
                  <div className="flex gap-3">
                    {dialog.isDestructive && (
                      <button onClick={() => setDialog({ isOpen: false })} className="flex-1 py-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white font-semibold transition-colors text-sm">
                        Cancel
                      </button>
                    )}
                    <button onClick={dialog.onConfirm} className={`flex-1 py-3 rounded-xl font-semibold transition-colors text-sm ${dialog.isDestructive ? 'bg-rose-500 hover:bg-rose-600' : 'bg-indigo-500 hover:bg-indigo-600'} text-white`}>
                      {dialog.confirmText}
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ExpenseSplitApp />);
  </script>
</body>
</html>
