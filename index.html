    function formatINR(n) {
      if (!isFinite(n)) n = 0;

    function formatForDateInput(ts) {

    function greedySettle(ids, amts) {
      const creditors = [];
      const debtors = [];
      ids.forEach((id, idx) => {
        const v = amts[idx];
        if (v > 0.5) creditors.push({ id, amt: v });
        else if (v < -0.5) debtors.push({ id, amt: -v });
      });
      creditors.sort((a, b) => b.amt - a.amt);
      debtors.sort((a, b) => b.amt - a.amt);
      const res = [];
      let ci = 0, di = 0;
      while (ci < creditors.length && di < debtors.length) {
        const c = creditors[ci], d = debtors[di];
        const amt = Math.min(c.amt, d.amt);
        res.push({ from: d.id, to: c.id, amount: Math.round(amt) });
        c.amt -= amt; d.amt -= amt;
        if (c.amt < 0.5) ci++;
        if (d.amt < 0.5) di++;
      }
      return res;
    }

    function optimalSettle(ids, amts) {
      let best = null;
      function dfs(bal, txns) {
        let i = 0;
        while (i < bal.length && Math.abs(bal[i]) < 0.5) i++;
        if (i === bal.length) {
          if (!best || txns.length < best.length) best = txns.slice();
          return;
        }
        if (best && txns.length >= best.length) return; 
        for (let j = 0; j < bal.length; j++) {
          if (j === i || Math.abs(bal[j]) < 0.5) continue;
          if ((bal[i] > 0) === (bal[j] > 0)) continue; 
          const amt = Math.min(Math.abs(bal[i]), Math.abs(bal[j]));
          const next = bal.slice();
          next[i] += bal[i] > 0 ? -amt : amt;
          next[j] += bal[j] > 0 ? -amt : amt;
          const from = bal[i] < 0 ? ids[i] : ids[j];
          const to = bal[i] < 0 ? ids[j] : ids[i];
          txns.push({ from, to, amount: amt });
          dfs(next, txns);
          txns.pop();
        }
      }
      dfs(amts.slice(), []);
      return (best || []).map((t) => ({ from: t.from, to: t.to, amount: Math.round(t.amount) })).filter((t) => t.amount > 0);
    }

    function regularSettle(expensesList, settlementsList) {
      const net = {}; 
      function addOwed(ower, payee, amt) {
        if (ower === payee || !amt) return;
        let a = ower, b = payee, sign = 1;
        if (a > b) { [a, b] = [b, a]; sign = -1; }
        const key = a + "|" + b;
        net[key] = (net[key] || 0) + sign * amt;
      }
      expensesList.forEach((e) => {
        e.participants.forEach((p) => {
          if (p === e.paidBy) return;
          const share = e.splitType === "equal" ? e.amount / e.participants.length : (e.customSplits[p] || 0);
          addOwed(p, e.paidBy, share);
        });
      });
      settlementsList.forEach((s) => {
        addOwed(s.from, s.to, -s.amount);
      });
      const res = [];
      Object.keys(net).forEach((key) => {
        const val = net[key];
        if (Math.abs(val) < 0.5) return;
        const [a, b] = key.split("|");
        if (val > 0) res.push({ from: a, to: b, amount: Math.round(val) });
        else res.push({ from: b, to: a, amount: Math.round(-val) });
      });
      return res;
    }

      // Custom Categories State (persisted locally; stored as { [id]: { id, label, iconName, color, bg, hex, custom:true } })
      const [customCategories, setCustomCategories] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem("squadsplit_custom_categories")) || {};
        } catch {
          return {};
        }
      });

      useEffect(() => {
        localStorage.setItem("squadsplit_custom_categories", JSON.stringify(customCategories));
      }, [customCategories]);

      const CATEGORIES = useMemo(() => {
        const merged = { ...DEFAULT_CATEGORIES };
        Object.values(customCategories).forEach((c) => {
          merged[c.id] = {
            ...c,
            icon: (CATEGORY_ICON_CHOICES.find((i) => i.name === c.iconName) || CATEGORY_ICON_CHOICES[0]).icon,
          };
        });
        return merged;
      }, [customCategories]);

      function addCustomCategory({ label, iconName, color, bg, hex }) {
        const trimmed = label.trim();
        if (!trimmed) return;
        const slug = trimmed.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
        let id = `custom_${slug || "category"}`;
        if (CATEGORIES[id]) id = `${id}_${Date.now().toString(36)}`;
        setCustomCategories((prev) => ({
          ...prev,
          [id]: { id, label: trimmed, iconName, color, bg, hex, custom: true },
        }));
      }

      function removeCustomCategory(id) {
        setCustomCategories((prev) => {
          const next = { ...prev };
          delete next[id];
          return next;
        });
      }

      const [newCatLabel, setNewCatLabel] = useState("");
      const [newCatIconName, setNewCatIconName] = useState(CATEGORY_ICON_CHOICES[0].name);

      const [expenseDate, setExpenseDate] = useState(Date.now());

      const [participants, setParticipants] = useState([]);

      const [customSplits, setCustomSplits] = useState({});
      const [formError, setFormError] = useState("");
      const [isScanning, setIsScanning] = useState(false);
      const [receiptImage, setReceiptImage] = useState(null);

      const [dialog, setDialog] = useState({ isOpen: false, title: "", message: "", onConfirm: null, confirmText: "Confirm", isDestructive: true });

      const effectivePaidBy = members.find((m) => m.id === paidBy) ? paidBy : (members[0]?.id || "");
      const memberOf = (id) => members.find((m) => m.id === id) || { name: "Unknown", color: "bg-zinc-600" };

      const balances = useMemo(() => {
        const bal = {};
        members.forEach((m) => (bal[m.id] = 0));
        
        expenses.forEach((e) => {
          bal[e.paidBy] = (bal[e.paidBy] || 0) + e.amount;
          e.participants.forEach((p) => {
            let share = 0;
            if (e.splitType === "equal") {
              share = e.amount / e.participants.length;
            } else {
              share = e.customSplits[p] || 0;
            }
            bal[p] = (bal[p] || 0) - share;
          });
        });

        settlements.forEach((s) => {
          bal[s.from] = (bal[s.from] || 0) + s.amount;
          bal[s.to] = (bal[s.to] || 0) - s.amount;
        });
        return bal;
      }, [members, expenses, settlements]);

      const settleMode = activeGroup.settleMode || "smart";

      function changeSettleMode(mode) {

      const suggestions = useMemo(() => {
        if (settleMode === "regular") {
          return regularSettle(expenses, settlements);
        }
        const ids = [];
        const amts = [];
        Object.entries(balances).forEach(([id, v]) => {
          if (Math.abs(v) > 0.5) { ids.push(id); amts.push(v); }
        });
        if (ids.length === 0) return [];
        return ids.length > 12 ? greedySettle(ids, amts) : optimalSettle(ids, amts);
      }, [balances, settleMode, expenses, settlements]);

      const totalSpent = expenses.reduce((s, e) => s + e.amount, 0);

      // Analytics Logic
      const filteredExpenses = useMemo(() => {
        if (analyticsFilter === "all") {
          return expenses.map(e => ({...e, share: e.amount}));
        }
        return expenses.map(e => {
          let share = 0;
          if (e.participants.includes(analyticsFilter)) {
             if (e.splitType === "equal") {
               share = e.amount / e.participants.length;
             } else {
               share = e.customSplits[analyticsFilter] || 0;
             }
          }
          return { ...e, share };
        }).filter(e => e.share > 0);
      }, [expenses, analyticsFilter]);

      const filteredTotalSpent = useMemo(() => 
        filteredExpenses.reduce((sum, e) => sum + e.share, 0)
      , [filteredExpenses]);

      const filteredCategoryBreakdown = useMemo(() => {
        const breakdown = {};
        Object.keys(CATEGORIES).forEach(k => breakdown[k] = 0);
        filteredExpenses.forEach(e => {

        return Object.entries(breakdown)
          .map(([cat, amt]) => ({ ...CATEGORIES[cat], amount: amt, percent: filteredTotalSpent ? (amt / filteredTotalSpent) * 100 : 0 }))
          .filter(c => c.amount > 0)
          .sort((a, b) => b.amount - a.amount);
      }, [filteredExpenses, filteredTotalSpent]);
      
      const pieConicStops = useMemo(() => {

      const activity = useMemo(() => {

      useEffect(() => {

      function requestRemoveMember(groupId, memberId) {

      const handleDateChange = (e) => {

      function compressImageForStorage(file, maxDim = 1000, quality = 0.6) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              let { width, height } = img;
              if (width > maxDim || height > maxDim) {
                if (width > height) {
                  height = Math.round(height * (maxDim / width));
                  width = maxDim;
                } else {
                  width = Math.round(width * (maxDim / height));
                  height = maxDim;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = () => reject(new Error("Could not read the image."));
            img.src = reader.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function handleReceiptUpload(e) {
        const file = e.target.files?.[0];
        if (!file) return;

        setFormError("");
        setIsScanning(true);

        try {
          const base64Data = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => {
                const result = reader.result;
                if (typeof result === 'string') {
                  resolve(result.split(',')[1]); 
                } else {
                  reject(new Error("Failed to read file"));
                }
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });

          try {
            const compressed = await compressImageForStorage(file);
            setReceiptImage(compressed);
          } catch (imgErr) {
            console.error("Could not store receipt image:", imgErr);
          }

          const categoryIdList = Object.keys(CATEGORIES).join(", ");
          const prompt = `Analyze this receipt. Return a JSON object with 'amount' (number, total amount paid), 'description' (string, usually the merchant or store name), 'category' (string, MUST be exactly one of these: ${categoryIdList}), and 'receiptDate' (string, ISO 8601 format like "YYYY-MM-DDTHH:mm:00" representing the date and time on the receipt. If no year, assume current year. If no time, assume 12:00:00. If no date at all, omit it). Be as accurate as possible. Only return the JSON.`;

          const effectiveApiKey = apiKey || ""; 
          // Canvas mandatory fallback for accurate layout capabilities
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${effectiveApiKey}`;

          const payload = {
            contents: [{
              role: "user",
              parts: [
                { text: prompt },
                {
                  inlineData: {
                    mimeType: file.type || 'image/jpeg',
                    data: base64Data
                  }
                }
              ]
            }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  amount: { type: "NUMBER" },
                  description: { type: "STRING" },
                  category: { type: "STRING" },
                  receiptDate: { type: "STRING" }
                },
                required: ["amount", "description", "category"]
              }
            }
          };

          let resultData;
          let delay = 1000;
          let lastError = null;

          for (let i = 0; i < 3; i++) {
            try {
              const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });

              if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                const status = response.status;
                if (status === 400 && errData?.error?.message?.includes('API key')) {
                   throw new Error("Missing or invalid Gemini API Key! Please click the Gear icon in the top right to set it.");
                }
                throw new Error(errData?.error?.message || `HTTP ${status}`);
              }

              resultData = await response.json();
              break;
            } catch (err) {
              console.error(`API Error (Attempt ${i + 1}):`, err);
              lastError = err;
              if (!err.message.includes("429") || i === 2) throw err;
              await new Promise(res => setTimeout(res, delay));
              delay *= 2;
            }
          }

          if (!resultData) {
            throw lastError || new Error("Failed to reach the AI service.");
          }

          const candidate = resultData.candidates?.[0];
          let jsonText = candidate?.content?.parts?.[0]?.text;

          if (jsonText) {
            jsonText = jsonText.replace(/```json/gi, '').replace(/```/g, '').trim();
            const parsed = JSON.parse(jsonText);

            if (parsed.amount) setAmount(parsed.amount.toString());
            if (parsed.description) setDesc(parsed.description);
            if (parsed.receiptDate) {
                const parsedTs = Date.parse(parsed.receiptDate);
                if (!isNaN(parsedTs)) {
                    setExpenseDate(parsedTs);
                }
            }

            if (parsed.category && CATEGORIES[parsed.category.toLowerCase()]) {
                setCategory(parsed.category.toLowerCase());
            } else {
                setCategory("other");
            }
          } else {
            throw new Error("Could not extract data from the receipt.");
          }
        } catch (err) {
          console.error("Scanning error:", err);
          setFormError(err.message || "Receipt scan failed. Please try again or enter details manually.");
        } finally {
          setIsScanning(false);
          if (e.target) e.target.value = '';
        }
      }

      function handleSaveExpense(e) {
        e.preventDefault();
        setFormError("");
        const amt = parseFloat(amount);
        
        if (!amt || amt <= 0) return setFormError("Please enter a valid amount.");
        if (participants.length === 0) return setFormError("Select at least one person.");

        const finalDesc = desc.trim() || CATEGORIES[category].label;
        let finalCustomSplits = { ...customSplits };

        if (splitType === "exact") {
          const sum = participants.reduce((s, p) => s + (finalCustomSplits[p] || 0), 0);
          if (Math.abs(sum - amt) > 0.5) return setFormError(`Exact splits must add up to ${formatINR(amt)}. Current sum: ${formatINR(sum)}.`);
        } else if (splitType === "percentage") {
          const percentSum = participants.reduce((s, p) => s + (finalCustomSplits[p] || 0), 0);
          if (Math.abs(percentSum - 100) > 0.5) return setFormError(`Percentages must add up to 100%. Current sum: ${percentSum}%.`);
          
          participants.forEach(p => {
            finalCustomSplits[p] = (finalCustomSplits[p] / 100) * amt;
          });
        }

        const newExpense = {
          id: editingExpenseId || ("e" + Date.now()),
          description: finalDesc,
          amount: amt,
          category,
          paidBy: effectivePaidBy,
          participants: [...participants],
          splitType: splitType === "percentage" ? "exact" : splitType, 
          customSplits: finalCustomSplits,
          date: expenseDate,
          receiptImage: receiptImage || null,
        };

        updateGroupInDB(activeGroupId, (g) => {
            if (editingExpenseId) {
                return { expenses: g.expenses.map(exp => exp.id === editingExpenseId ? newExpense : exp) };
            } else {
                return { expenses: [newExpense, ...g.expenses] };
            }
        });
        
        handleCloseModal();
      }

      function handleSettle(s) {
        updateGroupInDB(activeGroupId, (g) => ({
           settlements: [...g.settlements, { id: "s" + Date.now(), from: s.from, to: s.to, amount: s.amount, date: Date.now() }]
        }));
      }

      function deleteExpense(id) {
        updateGroupInDB(activeGroupId, (g) => ({
           expenses: g.expenses.filter((e) => e.id !== id)

      }

      function deleteSettlement(id) {
        updateGroupInDB(activeGroupId, (g) => ({
           settlements: g.settlements.filter((s) => s.id !== id)
        }));
      }

      const customRemaining = splitType === "exact" 
        ? (parseFloat(amount) || 0) - participants.reduce((s, p) => s + (customSplits[p] || 0), 0)
        : 100 - participants.reduce((s, p) => s + (customSplits[p] || 0), 0);

      if (!isDBReady) {
        return (
          <div className="min-h-screen bg-[#050505] flex items-center justify-center p-0 sm:p-4">
            <div className="w-full h-[100dvh] sm:h-[850px] sm:max-h-[90vh] sm:max-w-[420px] bg-[#0A0A0B] sm:rounded-[2.5rem] sm:border-[6px] border-zinc-800 shadow-2xl flex flex-col items-center justify-center gap-4 relative overflow-hidden">
                <div className="absolute inset-0 bg-gradient-to-br from-indigo-900/10 to-purple-900/10 z-0"></div>
                <Icons.Loader2 size={38} className="text-indigo-500 animate-spin z-10" />

                                onClick={() => setNewCatIconName(opt.name)}
                                className={`w-9 h-9 rounded-xl flex items-center justify-center border transition-colors ${newCatIconName === opt.name ? "bg-indigo-500/20 border-indigo-500 text-indigo-300" : "bg-zinc-900 border-zinc-800 text-zinc-500 hover:text-zinc-300"}`}
                              >
                                {React.createElement(opt.icon, { size: 16 })}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div>
                          <p className="text-[10px] font-semibold text-zinc-500 uppercase tracking-wider mb-2">Color</p>
                          <div className="flex flex-wrap gap-2">
                            {CATEGORY_COLOR_CHOICES.map((opt, idx) => (
                              <button
                                key={idx}
                                type="button"
                                onClick={() => setNewCatColorIdx(idx)}
                                style={{ backgroundColor: opt.hex }}
                                className={`w-7 h-7 rounded-full transition-transform ${newCatColorIdx === idx ? "ring-2 ring-offset-2 ring-offset-zinc-950 ring-white scale-105" : "opacity-80 hover:opacity-100"}`}
                              />
                            ))}
                          </div>
                        </div>

                        <button
                          onClick={handleAddCategorySubmit}
                          disabled={!newCatLabel.trim()}
                          className="w-full py-2.5 rounded-xl bg-indigo-500 hover:bg-indigo-600 disabled:opacity-40 disabled:cursor-not-allowed text-white text-xs font-semibold transition-colors flex items-center justify-center gap-1.5"
                        >
                          <Icons.Plus size={14} /> Add Category
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ExpenseSplitApp />);
  </script>
</body>
</html>
